[pydocstyle]
# D211 conflicts with D203 (we follow D203 — one blank line before class docstring).
# D213 conflicts with D212 (we follow D212 — multi-line summary on the first line).
# Both pairs of rules cannot be satisfied simultaneously; pick one side per pair.
add-ignore = D211,D213

[bandit]
# B101 fires on every `assert` used in pytest tests. Pytest depends on assert
# rewriting; the bytecode-stripping concern doesn't apply to test files.
# Exclude test directories entirely so pytest assertions are not flagged.
exclude_dirs = ./pgatk/tests,./tests
# B202 (tarfile.extractall) — _safe_extract_tar in pgatk/cgenomes/cosmic_downloader.py
# performs explicit member-by-member validation before calling extractall(members=…)
# with the validated list. Annotated with `# nosec B202` at the call site.
skips = B101
